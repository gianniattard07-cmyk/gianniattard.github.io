<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCAST Style Guide</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body { width: auto; padding: 40px; border: none; }
        .guide-section { margin-bottom: 40px; padding: 20px; border: 1px solid #ddd; }
    </style>
</head>
<body>
    <h1>What elements used</h1>

    <section class="guide-section">
        <h2>Colour Palette</h2>
        <div class="flex-row" style="justify-content: flex-start; gap: 20px;">
            <div style="background:#040340; width:60px; height:60px;"></div>
            <p>Hex: 040340</p>
            <div style="background:#FFFFFF; width:60px; height:60px; border:1px solid #000;"></div>
            <p>Hex: FFFFFF</p>
        </div>
    </section>

    <section class="guide-section">
        <h2>Typography & Spacing</h2>
        <p>Family: ABeeZee</p>
        <p>Line Height: 29px</p>
        <p>Letter Spacing: 9%</p>
    </section>

    <section class="guide-section">
        <h2>Button Hover Interaction</h2>
        <div class="btn-large" style="width: 250px;">Hover Example</div>
    </section>
</body>
</html>
