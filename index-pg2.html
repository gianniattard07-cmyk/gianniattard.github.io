<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCAST - Full-Time Courses</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="iphone-viewport gray-bg">

    <main class="course-page">
        <section class="lofi-grey-header">
            <h1 class="lofi-title">Full-Time Course</h1>
            <a href="index.html" class="lofi-back-pill">Back</a>
        </section>

        <section class="institute-list">
            
            <div class="institute-block">
                <button class="inst-button-blue">Institute of Applied Sciences</button>
                <div class="inst-photo">
                    <img src="images/applied-sciences.jpg" alt="Applied Sciences">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">Institute of Business Management and Commerce</button>
                <div class="inst-photo">
                    <img src="images/business.jpg" alt="Business">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">Institute for the Creative Arts</button>
                <div class="inst-photo">
                    <img src="images/creative-arts.jpg" alt="Creative Arts">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">Institute of Community Services</button>
                <div class="inst-photo">
                    <img src="images/community.jpg" alt="Community">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">Institute of Engineering and Transport</button>
                <div class="inst-photo">
                    <img src="images/engineering.jpg" alt="Engineering">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">Institute of Information And Communication Technology</button>
                <div class="inst-photo">
                    <img src="images/ict.jpg" alt="ICT">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">Gozo Campus</button>
                <div class="inst-photo">
                    <img src="images/gozo.jpg" alt="Gozo">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">Centre for Learning and Employability</button>
                <div class="inst-photo">
                    <img src="images/cle.jpg" alt="CLE">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">ARIC</button>
                <div class="inst-photo">
                    <img src="images/aric.jpg" alt="ARIC">
                </div>
            </div>

            <div class="institute-block">
                <button class="inst-button-blue">INSTITUTE FOR THE TRADES</button>
                <div class="inst-photo">
                    <img src="images/trades.jpg" alt="Trades">
                </div>
            </div>

        </section>
    </main>

</body>
</html>
